# Shared settings for all named forecasts.
forecast:
  # Pins Sales/Rental/Eilers snapshots once, across later batches of experiments.
  # Change this revision explicitly when forecasting from refreshed source data.
  data_revision: baseline_v1
  sources:
    sales: development_042_silver_sandbox.demand_forecast.sales_silver_comp
    lease: development_042_silver_sandbox.demand_forecast.lease_units_bronz
    performance: development_042_silver_sandbox.demand_forecast.eilers_group_historical_time_series
  source_versions:
    sales: null
    lease: null
    performance: null
  settings:
    distance_cutoff: 0.40
    minimum_neighbors: 3
    # Notebook 05 counts distinct observed months before the target prediction month.
    sales_min_observed_months: 6
    rental_min_observed_months: 9
    horizon_months: 12  # Forecast length for every channel.
    slot_counts: []  # Any positive no_of_slots.
    lease_value_column: source_row_count
    lease_metric_name: monthly_rental_records
    lease_curve_label: Monthly rental records
    performance_metrics:
      - avg_coin_in_index_vs_house
      - avg_theo_net_win_index_vs_house
  outputs:
    demand: development_042_silver_sandbox.demand_forecast.demand_forecast_results
    performance: development_042_silver_sandbox.demand_forecast.performance_forecast_results
    neighbors: development_042_silver_sandbox.demand_forecast.forecast_neighbors_kept
    runs: development_042_silver_sandbox.demand_forecast.forecast_runs
    attempts: development_042_silver_sandbox.demand_forecast.forecast_run_attempts
  tracking:
    experiment_path: /Shared/AI_Feature_Extraction_Forecasts
  selection:
    similarity_experiment_ids: []  # Optionally restrict enabled experiments to these saved 05 IDs.
  monitoring:
    history_rows: 30

# Notebook 07: actuals/cohorts refresh independently of saved predictions.
evaluation:
  data_revision: labels_v1
  sources:
    sales: development_042_silver_sandbox.demand_forecast.sales_silver_comp
    lease: development_042_silver_sandbox.demand_forecast.lease_units_bronz
    performance: development_042_silver_sandbox.demand_forecast.eilers_group_historical_time_series
    mappings: development_042_silver_sandbox.demand_forecast.game_attr_ai_silver
  source_versions:
    sales: null
    lease: null
    performance: null
    mappings: null
  settings:
    evaluation_months: 12
    minimum_observed_months: 2
    bracket_month: 12
    validation_fraction: 0.20
    test_fraction: 0.20
    exclude_pre_release_curves: true
    exclude_cumulative_imputed_history: false
    performance_metrics:
      - avg_coin_in_index_vs_house
      - avg_theo_net_win_index_vs_house
  outputs:
    cohorts: development_042_silver_sandbox.demand_forecast.forecast_evaluation_cohorts
    cohort_runs: development_042_silver_sandbox.demand_forecast.forecast_evaluation_cohort_runs
    splits: development_042_silver_sandbox.demand_forecast.forecast_train_test_split
    eligibility: development_042_silver_sandbox.demand_forecast.forecast_evaluation_eligibility
    metrics: development_042_silver_sandbox.demand_forecast.forecast_error_metrics
    selected: development_042_silver_sandbox.demand_forecast.forecast_selected_configurations
    selection_runs: development_042_silver_sandbox.demand_forecast.forecast_selection_runs
    runs: development_042_silver_sandbox.demand_forecast.forecast_evaluation_runs
    attempts: development_042_silver_sandbox.demand_forecast.forecast_evaluation_attempts
    actuals_snapshots: development_042_silver_sandbox.demand_forecast.forecast_actuals_snapshots
    batches: development_042_silver_sandbox.demand_forecast.forecast_evaluation_batches
  tracking:
    experiment_path: /Shared/AI_Feature_Extraction_Evaluation
  selection:
    forecast_run_ids: []  # Evaluate completed runs matching the enabled named experiments.
  monitoring:
    history_rows: 30
